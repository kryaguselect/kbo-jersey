const state = { team: "", cat: "", size: "", instock: true, q: "", sort: "" };

// "95(M)", "MD(95)", "095" and "95" all mean the same chest size
const sizeKey = s => { const m = String(s).match(/\d{2,3}/); return m && !/키즈|세|Y[A-Z]/.test(s) ? String(+m[0]) : null; };

// teams whose shops the crawler cannot read yet still get a chip (not on the public build)
const PENDING = DATA.shop ? [] : ["樂天巨人", "起亞虎"];
// fixed order for the team buttons (the crawl order changes from run to run); teams not listed go to the end
const TEAM_ORDER = ["國家代表隊", "LG 雙子", "斗山熊", "培證英雄", "KT 巫師", "韓華鷹", "NC 恐龍", "三星獅", "樂天巨人", "起亞虎", "SSG 登陸者"];
const teamRank = t => (TEAM_ORDER.indexOf(t) + 1) || TEAM_ORDER.length + 1;
const teams = [...new Set([...DATA.items.map(i => i.team), ...PENDING])].sort((a, b) => teamRank(a) - teamRank(b));
const sizeKeys = [...new Set(DATA.items.flatMap(i => i.sizes.map(s => sizeKey(s.size))).filter(Boolean))].sort((a, b) => a - b);

// resale prices come from prices.js (generated from prices.csv by prices.py)
const PRICES = Object.assign({ tiers: {}, items: {}, names: {}, categories: {}, kits: {} }, window.PRICES);
// the public build (build_site.py) ships jerseys with zh/twd already filled in and no shop url or KRW price
const zhName = i => i.zh || PRICES.names[itemId(i.url)] || i.name;
const zhCat = c => PRICES.categories[c] || c;
// jerseys whose 背號 dropdown offers a custom name/number choice (wording comes from marking-names.csv)
const CUSTOM = "可客製化背號球衣";
const playerZh = (k, p) => p.zh || (PRICES.players || {})[k.name + "|" + p.name] || p.name;
const isCustom = i => (i.markings || []).some(k => k.players.some(p => p.available && playerZh(k, p).includes("客製化")));
// jerseys the shop has cut the price of (crawler sets "was" = KRW price before the cut; the public build only ships "sale")
const SALE = "降價球衣";
const isSale = i => !!(i.sale || i.was);
// per-team categories for one player: jerseys whose 背號 dropdown has that player (still available), owner's request
// in that category the card shows the player's 背號 fixed (no dropdown) and one price: jersey + 背號 - discount;
// the discount depends on the jersey's (Chinese) category name: the first key it contains wins
const PLAYER_CATS = { "韓華鷹": { "王彥程背號球衣": { ko: "왕옌청", label: "19 왕옌청 (王彥程)", discount: { "球迷版": 150, "球員版": 150 } } } };
const discountOf = (i, pc) => {
  const names = (i.categories || []).map(zhCat).join(" ");
  const key = Object.keys(pc.discount || {}).find(k => names.includes(k));
  return key ? pc.discount[key] : 0;
};
// jerseys that take a custom name/number count too: the customer can have that player's name put on (owner's request)
// 只看有貨 on (always on the public site): the player's 背號 must still be available; off (owner's page): any jersey listing him
const hasPlayer = (i, ko) => isCustom(i) || (i.markings || []).some(k => k.players.some(p => p.name.includes(ko)
  && (p.available || !state.instock)));
const playerCat = (i, c) => (PLAYER_CATS[i.team] || {})[c];
const inCat = (i, c) => c === CUSTOM ? isCustom(i) : c === SALE ? isSale(i)
  : playerCat(i, c) ? hasPlayer(i, playerCat(i, c).ko) : (i.categories || []).includes(c);
const itemId = url => {
  if (!url) return "";
  const m = url.match(/\/product\/[^?]*?\/(\d+)\/category\/|goodsNo=(\d+)|productId=(\d+)|\/category\/detail\/(\d+)|itemId=(\d+)|PROD_CD=(\w+)/);
  return m ? url.replace(/^https?:\/\/(www\.)?/, "").split("/")[0] + "/" + (m[1] || m[2] || m[3] || m[4] || m[5] || m[6]) : url;
};
// a per-jersey price wins; otherwise use the price table keyed by the shop's KRW price
const shipFee = i => i.ship || (PRICES.ship || {})[itemId(i.url)];  // shop charges shipping below its free-shipping threshold
// does jersey + this 背號 reach the free-shipping threshold? (public site ships a ready-made "free" flag instead of KRW prices)
// a choice with its own KRW price: from the shop page, or the kit price plus the 加價 in marking-names.csv
const ownKrw = (k, p) => p.price || (PRICES.playerKrw || {})[k.name + "|" + p.name];
const kitFree = (i, k, p) => {
  const flag = p && p.free !== undefined ? p.free : k.free;
  if (flag !== undefined) return flag;
  const limit = (PRICES.shipping || {})[i.team];
  return !!limit && (i.price || 0) + ((p && ownKrw(k, p)) || k.price || 0) >= limit;
};
const shipText = i => "單買另加運費 NT$" + shipFee(i) + ((i.markings || []).some(k => kitFree(i, k)) ? "(加購背號免加)" : "");
const priceOf = i => { const id = itemId(i.url), tier = PRICES.tiers[i.price];  // 代購價 in TWD, or undefined
  return i.twd || PRICES.items[id] || (tier && tier + ((PRICES.extra || {})[id] || 0)) || undefined; };
const priceText = i => { const p = shownPrice(i); return p ? "NT$" + p.toLocaleString() : "價格請洽詢"; };
// the 背號 choice used in a player category: that player's own choice, or else the custom name/number choice
const playerChoice = (i, pc) => {
  const all = (i.markings || []).flatMap(k => k.players.map(p => ({ k, p })));
  return all.find(x => x.p.available && x.p.name.includes(pc.ko)) || all.find(x => x.p.available && playerZh(x.k, x.p).includes("客製化"))
    || all.find(x => x.p.name.includes(pc.ko));  // owner's page with 只看有貨 off: priced as if his 背號 were available
};
const choiceCost = ({ k, p }) => p.twd || PRICES.tiers[ownKrw(k, p)] || k.twd || PRICES.tiers[k.price];
const activePlayerCat = i => state.cat && playerCat(i, state.cat);
const shownPrice = i => {  // jersey + the player's 背號 - discount while that player's category is open
  const pc = activePlayerCat(i), base = priceOf(i), x = pc && playerChoice(i, pc);
  if (!pc || !base) return base;
  // jerseys sold with a mandatory 背號 (surcharges.csv, e.g. 韓華 열마킹) already carry its price: don't add it twice
  const kit = (PRICES.extra || {})[itemId(i.url)] && !PRICES.items[itemId(i.url)] || i.kitIncluded ? 0 : x && choiceCost(x);
  return kit === undefined || kit === null ? base : base + kit - discountOf(i, pc);
};

// 背號 (marking kits: name + number sets sold as add-ons): one dropdown per kit, listing its players
function markingRows(i) {
  if (!(i.markings || []).length) return "";
  return el("div", { className: "kits", onchange: e => {  // picking a 背號 may lift the order over the free-shipping threshold
      if (e.target.selectedIndex > 0)
        track("select_marking", { item_name: zhName(i), team: i.team, player: e.target.selectedOptions[0].textContent.replace(/＋.*|\(售完\)/g, "") });
      const note = e.currentTarget.closest(".card").querySelector(".ship");
      if (!note) return;
      const free = [...e.currentTarget.querySelectorAll("select")].some(s => s.selectedIndex > 0 && s.selectedOptions[0].dataset.free);
      note.textContent = free ? "已加購背號,免另加運費" : shipText(i);
      note.classList.toggle("free", free);
    } },
    ...i.markings.map(k => {
      const twd = k.twd || PRICES.tiers[k.price];
      const title = (k.zh || PRICES.kits[k.name] || k.name) + (twd ? " NT$" + twd.toLocaleString() : "");
      return el("select", { className: "kit", ariaLabel: title },
        el("option", { value: "", textContent: title }),
        ...k.players.map(p => {
          const cost = p.twd || PRICES.tiers[ownKrw(k, p)] || twd;  // own price when it differs from the kit's (e.g. captain marking)
          const o = el("option", { textContent: playerZh(k, p) + (cost ? "＋NT$" + cost.toLocaleString() : "") + (p.available ? "" : "(售完)"), disabled: !p.available });
          if (kitFree(i, k, p)) o.dataset.free = "1";
          return o;
        }));
    }));
}

// player category: a fixed 背號 line instead of the dropdowns; the shipping note only when jersey + 背號 is still under the threshold
function playerRows(i) {
  const pc = activePlayerCat(i), x = playerChoice(i, pc);
  return [shipFee(i) && !(x && kitFree(i, x.k, x.p)) ? el("div", { className: "ship", textContent: "單買另加運費 NT$" + shipFee(i) }) : "",
          el("div", { className: "fixedkit", textContent: "背號:" + pc.label })];
}

// Google Analytics events: only the customer site has the tag (build_site.py); elsewhere this does nothing
const track = (name, params = {}) => { if (window.gtag) gtag("event", name, params); };
// a jersey in GA's own product format, so views show up in its built-in product report without extra setup
const gaItem = i => ({ items: [{ item_name: zhName(i), item_category: i.team, price: shownPrice(i) || undefined, currency: "TWD" }] });
const el = (tag, props = {}, ...kids) => { const e = Object.assign(document.createElement(tag), props); e.append(...kids); return e; };

function renderFilters() {
  const box = document.getElementById("teams");
  box.replaceChildren(...["", ...teams].map(t => {
    const b = el("button", { className: "chip", textContent: t || "全部球隊" });
    b.setAttribute("aria-pressed", state.team === t);
    b.onclick = () => { const x = box.scrollLeft; state.team = t; state.cat = ""; renderFilters(); render(); box.scrollLeft = x;
      track("select_team", { team: t || "全部球隊" }); };
    return b;
  }));
  // the shop's own categories, shown once a team that has them is picked
  const mine = state.team ? DATA.items.filter(i => i.team === state.team) : [];
  const cats = [...new Set(mine.flatMap(i => i.categories || []))];
  for (const [c, pc] of Object.entries(PLAYER_CATS[state.team] || {}))
    if (cats.length && mine.some(i => hasPlayer(i, pc.ko))) cats.push(c);
  if (cats.length && mine.some(isCustom)) cats.push(CUSTOM);
  // 降價球衣 is left out when one of the shop's own categories already lists exactly the same jerseys (KIA's 出清球衣)
  const shown = mine.filter(i => !state.instock || i.sizes.some(s => s.available));
  const onSale = shown.filter(isSale);
  const sameAsShopCategory = cats.some(c => c !== CUSTOM && !(PLAYER_CATS[state.team] || {})[c] && (list => list.length === onSale.length && list.every(isSale))(shown.filter(i => inCat(i, c))));
  if (cats.length && onSale.length && !sameAsShopCategory) cats.push(SALE);
  const catBox = document.getElementById("cats");
  catBox.hidden = !cats.length;
  catBox.replaceChildren(...(cats.length ? ["", ...cats] : []).map(c => {
    const b = el("button", { className: "chip", textContent: c ? zhCat(c) : "全部分類" });
    b.setAttribute("aria-pressed", state.cat === c);
    b.onclick = () => { const x = catBox.scrollLeft; state.cat = c; renderFilters(); render(); catBox.scrollLeft = x;
      track("select_category", { team: state.team, category: c ? zhCat(c) : "全部分類" }); };
    return b;
  }));
  // phones show the same two choices as dropdowns
  const teamSel = document.getElementById("teamSel"), catSel = document.getElementById("catSel");
  teamSel.replaceChildren(...["", ...teams].map(t => el("option", { value: t, textContent: t || "全部球隊", selected: state.team === t })));
  teamSel.onchange = () => { state.team = teamSel.value; state.cat = ""; renderFilters(); render();
    track("select_team", { team: state.team || "全部球隊" }); };
  catSel.hidden = !cats.length;
  catSel.replaceChildren(...["", ...cats].map(c => el("option", { value: c, textContent: c ? zhCat(c) : "全部分類", selected: state.cat === c })));
  catSel.onchange = () => { state.cat = catSel.value; renderFilters(); render();
    track("select_category", { team: state.team, category: state.cat ? zhCat(state.cat) : "全部分類" }); };
}

// size charts (size-charts.csv via prices.py; the public build ships them inside its data)
const CHARTS = DATA.charts || PRICES.charts || {};
const chartOf = i => CHARTS[i.chart || (PRICES.chartOf || {})[itemId(i.url)]];
// size suggestion (owner's request): the customer enters the chest width of a shirt that fits them well, laid flat
// (and, optionally, its length); the chart's 胸寬 (or 胸圍 ÷ 2) picks the size. 合身 = the smallest size at least that
// wide as their shirt (owner's choice 2026-10-25: never narrower), 寬鬆 = one size up; both are shown. A length that differs from the
// picked size by 3 cm or more gets a note. Remembered on that device for every chart.
const remember = (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} };
const recall = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
// "怎麼量": a shirt laid flat, chest width armpit to armpit, length from the back collar to the hem
const HOWTO_SVG = `<svg viewBox="0 0 220 150" role="img" aria-label="量法示意:胸寬為腋下到腋下,衣長為後領中心到下襬">
  <path d="M78 14 L60 18 L20 40 L34 66 L56 56 L56 136 L164 136 L164 56 L186 66 L200 40 L160 18 L142 14 Q110 30 78 14 Z"
        fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
  <line x1="58" y1="60" x2="162" y2="60" stroke="#d97706" stroke-width="2.5"/>
  <path d="M58 60 l7 -4 v8 z M162 60 l-7 -4 v8 z" fill="#d97706"/>
  <text x="66" y="77" font-size="12" fill="#d97706" font-weight="700">胸寬</text>
  <line x1="110" y1="24" x2="110" y2="134" stroke="#2563eb" stroke-width="2" stroke-dasharray="5 3"/>
  <path d="M110 24 l-4 7 h8 z M110 134 l-4 -7 h8 z" fill="#2563eb"/>
  <text x="116" y="112" font-size="12" fill="#2563eb" font-weight="700">衣長</text>
</svg>`;
let suggestTimer;
// the customer site remembers the entry on that device for every chart; the owner's pages never do (the owner looks
// sizes up for many different customers, owner's request 2026-10-25), and drop anything an earlier version kept
const SUGGEST_KEYS = ["my-chest", "my-length", "my-cpbl", "my-fit"];
if (!DATA.shop) SUGGEST_KEYS.forEach(k => remember(k, null));
const keep = (k, v) => { if (DATA.shop) remember(k, v); };
const kept = k => DATA.shop ? recall(k) : null;
function suggestBox(i, c, rows, has) {
  const w = c.cols.indexOf("胸寬"), g = c.cols.indexOf("胸圍"), L = c.cols.indexOf("衣長");
  if (w < 0 && g < 0) return "";  // nothing to compare with
  if (DATA.shop && !DATA.suggest) return "";  // customer site: not switched on yet (build_site.py PUBLIC_SIZE_SUGGEST)
  const widths = c.rows.map(r => w >= 0 ? r[w + 1] : r[g + 1] / 2);
  const num = (key, ph, label) => el("input", { type: "number", inputMode: "decimal", min: 20, max: 120, step: 0.5,
    placeholder: ph, value: kept(key) || "", "aria-label": label });
  const chest = num("my-chest", "例 56", "我的衣服胸寬(公分)"), len = num("my-length", "選填", "我的衣服衣長(公分,選填)");
  // or: "I wear size L of a CPBL team's jersey" (cpbl-sizes.csv) fills both boxes from that team's official table
  const CPBL = DATA.cpbl || PRICES.cpbl || {};
  const cpblTeam = el("select", { "aria-label": "中職球隊" }, el("option", { value: "", textContent: "中職球隊" }),
    ...Object.keys(CPBL).map(t => el("option", { value: t, textContent: t })));
  const cpblSize = el("select", { "aria-label": "平常穿的尺寸" });
  const fillSizes = () => cpblSize.replaceChildren(el("option", { value: "", textContent: "尺寸" }),
    ...(CPBL[cpblTeam.value] || []).map(([sz]) => el("option", { value: sz, textContent: sz })));
  const saved = (kept("my-cpbl") || "").split("|");
  if (CPBL[saved[0]]) { cpblTeam.value = saved[0]; fillSizes(); cpblSize.value = saved[1] || ""; } else fillSizes();
  const fromCpbl = () => { const r = (CPBL[cpblTeam.value] || []).find(x => x[0] === cpblSize.value); return r && String(chest.value) === String(r[1]) ? r : null; };
  cpblTeam.onchange = () => { fillSizes(); keep("my-cpbl", null); };
  cpblSize.onchange = () => {
    const r = (CPBL[cpblTeam.value] || []).find(x => x[0] === cpblSize.value);
    if (!r) return;
    chest.value = r[1]; keep("my-chest", r[1]);
    if (r[2] != null) { len.value = r[2]; keep("my-length", r[2]); }
    keep("my-cpbl", cpblTeam.value + "|" + cpblSize.value);
    apply(true);
  };
  const fig = el("div", { className: "howtoFig", hidden: true, innerHTML: HOWTO_SVG },
    el("div", {}, "衣服平放、扣好扣子：", el("b", { textContent: "胸寬" }), "量腋下到腋下的直線；",
      el("b", { textContent: "衣長" }), "量後領中心到下襬。"));
  const howto = el("button", { type: "button", className: "howto", textContent: "怎麼量？",
    onclick: () => { fig.hidden = !fig.hidden; howto.textContent = fig.hidden ? "怎麼量？" : "收起"; } });
  const advice = el("div", { className: "advice" });
  // one-line version shown while folded (owner's request 2026-10-25: the full text pushed the chart down on phones)
  const brief = el("div", { className: "brief" });
  const short = n => [el("b", { textContent: c.rows[n][0] }), has(c.rows[n][0]) === true ? "" : "（售完）"];
  const label = n => [el("b", { textContent: c.rows[n][0] }), has(c.rows[n][0]) === true ? "（有貨）" : "（目前售完）"];
  // the jersey's own chest width, so the customer can see why (charts in 胸圍 are halved)
  const widthOf = n => "，胸寬約 " + +widths[n].toFixed(1) + " 公分";
  let paint;  // set below, once the folding parts exist
  function apply(changed) {
    rows.forEach(r => r.classList.remove("suggested", "suggestedLoose", "smallest"));
    const mine = parseFloat(chest.value);
    if (!(mine >= 30 && mine <= 90)) {
      advice.replaceChildren("量一件自己常穿、尺寸剛好的衣服，填入胸寬就會標出建議尺寸。");
      brief.replaceChildren();
      if (changed && typeof paint === "function") paint();
      return;
    }
    let n = widths.findIndex(x => x != null && x >= mine);
    // even the smallest size is more than 3 cm wider than their shirt: no 合身 here, say how much bigger it is
    if (n === 0 && widths[0] - mine > 3) {
      rows[0].classList.add("smallest");
      brief.replaceChildren("最小的 ", ...short(0), " 也會偏大");
      advice.replaceChildren("這件最小的 ", ...label(0), "胸寬約 ", el("b", { textContent: +widths[0].toFixed(1) }),
        " 公分，比你的衣服寬約 " + +(widths[0] - mine).toFixed(1) + " 公分，穿起來會偏大。請再確認量法，或參考其他版型。");
      if (changed) { clearTimeout(suggestTimer); suggestTimer = setTimeout(() => track("size_suggest", { item_name: zhName(i), team: i.team, size: "偏大" }), 1200); }
      return;
    }
    const tooSmall = n < 0;
    if (tooSmall) n = widths.length - 1;
    const loose = !tooSmall && n < widths.length - 1 ? n + 1 : -1;
    rows[n].classList.add("suggested");
    if (loose >= 0) rows[loose].classList.add("suggestedLoose");
    const b = ["建議：合身 ", ...short(n)];
    if (loose >= 0) b.push("、寬鬆 ", ...short(loose));
    if (has(c.rows[n][0]) !== true) {
      const up = c.rows.findIndex((r, k) => k > n && has(r[0]) === true);
      if (up >= 0 && up !== loose) b.push("，有貨最接近 ", el("b", { textContent: c.rows[up][0] }));
    }
    brief.replaceChildren(...b);
    const out = ["合身選 ", ...label(n), widthOf(n)];
    if (loose >= 0) out.push("；想寬鬆選 ", ...label(loose), widthOf(loose));
    const via = fromCpbl();
    out.push(via ? `。依${cpblTeam.value} ${via[0]}（胸寬 ${+via[1]} 公分）推算。` : "。你的衣服胸寬 " + mine + " 公分。");
    if (tooSmall) out.push("這件最大的尺寸可能還是偏小。");
    // the 合身 size is sold out: point at the closest size that is in stock (bigger first: never narrower than their shirt)
    if (has(c.rows[n][0]) !== true) {
      const up = c.rows.findIndex((r, k) => k > n && has(r[0]) === true);
      const down = [...c.rows.keys()].reverse().find(k => k < n && has(c.rows[k][0]) === true);
      if (up >= 0) out.push("合身尺寸目前售完，有貨中最接近的是 ", el("b", { textContent: c.rows[up][0] }), widthOf(up), "。");
      else if (down != null) out.push("較大的尺寸都售完了，有貨的 ", el("b", { textContent: c.rows[down][0] }), "會比你的衣服窄約 " + +(mine - widths[down]).toFixed(1) + " 公分。");
      else out.push("這件目前沒有合適的尺寸有貨。");
    }
    const myLen = parseFloat(len.value), theirs = L >= 0 ? c.rows[n][L + 1] : null;
    if (myLen >= 40 && myLen <= 110 && theirs != null && Math.abs(theirs - myLen) >= 3)
      out.push(`${c.rows[n][0]} 的衣長比你的衣服${theirs > myLen ? "長" : "短"}約 ${+Math.abs(theirs - myLen).toFixed(1)} 公分。`);
    out.push("僅供參考，球衣版型各家不同。");
    advice.replaceChildren(...out);
    if (changed && typeof paint === "function") paint();
    if (changed) { clearTimeout(suggestTimer); suggestTimer = setTimeout(() => track("size_suggest", { item_name: zhName(i), team: i.team, size: c.rows[n][0] }), 1200); }
  }
  chest.oninput = () => { keep("my-chest", chest.value || null); keep("my-cpbl", null); cpblTeam.value = ""; fillSizes(); apply(true); };
  len.oninput = () => { keep("my-length", len.value || null); apply(true); };
  apply(false);
  // folded by default so the chart itself is what people see first (owner's request 2026-10-25): just a
  // "幫我選尺寸" button, or the remembered result with "修改" once they have entered something
  const body = el("div", { className: "body", hidden: true },
    el("label", {}, "我的衣服胸寬 ", chest, " 公分"),
    L >= 0 ? el("label", {}, "衣長 ", len, " 公分") : "",
    howto,
    Object.keys(CPBL).length ? el("div", { className: "cpbl" }, "或選我穿的中職球衣：", cpblTeam, cpblSize) : "",
    fig);
  const known = () => parseFloat(chest.value) >= 30 && parseFloat(chest.value) <= 90;
  const toggle = el("button", { type: "button", className: "toggle" });

function cropTo(box, src, [x0, y0, x1, y1, w, h], later) {
  const at = (start, part, all) => all > part ? 100 * start / (all - part) : 0;
  box.load = () => { box.style.backgroundImage = `url("${src}")`; };  // the gallery loads photos as they come up
  if (!later) box.load();
  Object.assign(box.style, { backgroundSize: `${100 * w / (x1 - x0)}% auto`,
    backgroundPosition: `${at(x0, x1 - x0, w)}% ${at(y0, y1 - y0, h)}%`, aspectRatio: `${x1 - x0} / ${y1 - y0}` });
}

  if (kept) {
    Object.assign(state, kept);
    document.getElementById("q").value = state.q;
    document.getElementById("size").value = state.size;
    document.getElementById("sort").value = state.sort;
    document.getElementById("instock").checked = state.instock;
  }
} catch (e) {}
const reloadPage = () => {
  try { sessionStorage.setItem(RELOAD_KEY, JSON.stringify(state)); } catch (e) {}
  location.reload();
};
renderFilters();
render();
setTop();
// opened from the iPhone home screen the page runs as an app that iPhone keeps in the background, with no
// pull-down-to-refresh: coming back to it after 30 minutes reloads, so the stock shown is not hours old
// (owner's choice 2026-10-25: this only, no pull-down gesture; on the customer site too)
if (navigator.standalone || matchMedia("(display-mode: standalone)").matches) {
  const loadedAt = Date.now();
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible" && Date.now() - loadedAt > 30 * 60 * 1000) reloadPage();
  });
}
// read the price table straight from the CSV, so saving it and reloading is enough
// (the public build has no CSV; its prices are already in the data)
fetch("price-table.csv?v=" + Date.now()).then(r => r.ok ? r.text() : "").then(text => {
  for (const line of text.split(/\r?\n/).slice(1)) {
    const [krw, twd] = line.split(",");
    const price = parseInt((twd || "").replace(/[^\d]/g, ""), 10);
    if (parseInt(krw, 10) && price) PRICES.tiers[parseInt(krw, 10)] = price;
  }
  render();
}).catch(() => {});
</script>
</body>
</html>
